<svg width="24" height="16" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Figma logo (original paths, unchanged) -->
  <g transform="translate(64 122)">
    <use xlink:href="#figma-b" transform="translate(-56 -116)" fill="#1ABCFE"/>
    <use xlink:href="#figma-c" transform="translate(-61 -111)" fill="#0ACF83"/>
    <use xlink:href="#figma-d" transform="matrix(0 1 1 0 -56 -121)" fill="#FF7262"/>
    <use xlink:href="#figma-e" transform="matrix(1 0 0 -1 -61 -116)" fill="#F24E1E"/>
    <use xlink:href="#figma-e" transform="matrix(1 0 0 -1 -61 -111)" fill="#A259FF"/>
  </g>

  <!-- Code brackets </> using Figma brand colors -->
  <!-- < (left bracket) — red -->
  <path d="M17 4 L14.5 8 L17 12" stroke="#F24E1E" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- / (slash) — purple -->
  <line x1="18" y1="12" x2="20" y2="4" stroke="#A259FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- > (right bracket) — orange -->
  <path d="M20.5 4 L23 8 L20.5 12" stroke="#FF7262" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <path id="figma-b" d="M0 2.5a2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1-5 0z"/>
    <path id="figma-c" d="M0 2.5A2.5 2.5 0 0 1 2.5 0H5v2.5a2.5 2.5 0 0 1-5 0z"/>
    <path id="figma-d" d="M0 0h5v2.5a2.5 2.5 0 0 1-5 0V0z"/>
    <path id="figma-e" d="M0 2.5A2.5 2.5 0 0 1 2.5 0H5v5H2.5A2.5 2.5 0 0 1 0 2.5z"/>
  </defs>
</svg>
