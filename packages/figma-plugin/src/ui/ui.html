<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; font: 12px/1.55 Inter, system-ui, sans-serif; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #202124); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: var(--figma-color-bg-secondary, #eee); }
    .good { color: #12804a; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 1px solid var(--figma-color-border, #ccc); border-radius: 5px; background: var(--figma-color-bg, #fff); color: inherit; }
    button { padding: 8px 12px; border: 0; border-radius: 5px; background: #0d99ff; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #reconnect-btn { margin-top: 8px; }
    .hint, #query-status { margin-top: 16px; color: var(--figma-color-text-secondary, #666); }
    .card { margin-top: 16px; padding: 12px; border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; }
    #design-meta { margin: 6px 0 10px; }
    #error { color: #d32f2f; margin-top: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="row"><strong>Codex Figma Bridge</strong><span id="status-pill" class="pill"><span id="status-text">connecting…</span></span></div>
  <label for="bridge-url">Bridge URL</label>
  <input id="bridge-url" type="text" placeholder="http://localhost:11111" />
  <button id="reconnect-btn">Reconnect</button>
  <div class="hint">Keep this plugin open in the file you want to implement. Codex searches every page when you ask:</div>
  <div class="card">实现 figma 节点「登录页」</div>
  <div class="hint">If names repeat, choose from the screenshots in Codex.</div>
  <div id="query-status">Waiting for a Codex request.</div>
  <div id="design-request" class="card" style="display:none;">
    <strong>Codex design ready</strong><div id="design-meta"></div>
    <button id="generate-design-btn">Generate design</button>
  </div>
  <div id="error" style="display:none;"></div>
  <!-- {{UI_JS}} -->
</body>
</html>
