# Codex CLI MCP server config — append to ~/.codex/config.toml
#
# Points Codex at the local Codex Figma Bridge. The installed plugin includes
# its own Bridge runtime and a SessionStart hook; it needs neither this snippet
# nor a separate npm install. If you use only this manual configuration, start the
# bridge with pnpm start or add the optional hook below.

[mcp_servers.codex-figma-bridge]
type = "http"
url = "http://localhost:11111/mcp"

# Optional for manual MCP setup ONLY (the installed plugin already has this).
# Replace the absolute path, then review and trust the hook in Codex /hooks.
# [[hooks.SessionStart]]
# [[hooks.SessionStart.hooks]]
# type = "command"
# command = 'node "/absolute/path/to/codex-figma/packages/codex-plugin/hooks/session-start.mjs"'
# timeout = 20
